<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="styles.css" >
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Social links profile</title>
</head>
<body>
  <section class="info">

    <img class="profile-img" src="assets/images/profile_photo.jpeg" alt="profile photo">

    <div class="container-one">
      <h1 class="profile-name">Maurycy Górski</h1>
      <p class="location">Gdańsk, Poland</p>
    </div>

    <blockquote>
      <p class="quote">"Front-end developer and avid reader."</p>
    </blockquote>

    <article class="btn-container">
      <button class="btn-style-one" type="button">GitHub</button>
      <button class="btn-style-one" type="button">Frontend Mentor</button>
      <button class="btn-style-one" type="button">LinkedIn</button>
      <button class="btn-style-one" type="button">Twitter</button>
      <button class="btn-style-one" type="button">Instagram</button>
    </article>
  </section> 
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
